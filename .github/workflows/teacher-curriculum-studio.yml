name: Teacher Curriculum Studio Checks

on:
  pull_request:
    paths:
      - "teacher-document-studio/**"
      - "netlify/functions/teacher-curriculum-*.mjs"
      - "netlify/functions/teacher-document-generate.mjs"
      - "netlify/functions/teacher-document-refine.mjs"
      - ".github/workflows/teacher-curriculum-studio.yml"
  push:
    branches:
      - main
      - feature/teacher-curriculum-outcome-library
      - feature/refined-editable-teacher-documents
    paths:
      - "teacher-document-studio/**"
      - "netlify/functions/teacher-curriculum-*.mjs"
      - "netlify/functions/teacher-document-generate.mjs"
      - ".github/workflows/teacher-curriculum-studio.yml"

permissions:
  contents: read

jobs:
  syntax-and-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Netlify function syntax
        run: |
          node --check netlify/functions/teacher-curriculum-extract.mjs
          node --check netlify/functions/teacher-curriculum-recommend.mjs
          node --check netlify/functions/teacher-document-generate.mjs
          node --check netlify/functions/teacher-document-refine.mjs
      - name: Check inline Teacher Studio JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('teacher-document-studio/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No inline scripts found in Teacher Document Studio');
          scripts.forEach((source, index) => new vm.Script(source, { filename: `teacher-document-studio-inline-${index + 1}.js` }));
          const catalog = JSON.parse(fs.readFileSync('teacher-document-studio/curriculum/kenya-learning-areas-grade1-12.json', 'utf8'));
          for (const grade of ['1-3', '4-6', '7-9', '10-12']) {
            if (!catalog.grades[grade]) throw new Error(`Missing curriculum catalogue for grades ${grade}`);
          }
          console.log(`Validated ${scripts.length} inline script(s) and curriculum catalogue.`);
          NODE
