name: AI Resources Centre build
on:
  pull_request:
    paths:
      - "ai-resources-centre/**"
      - ".github/workflows/ai-resources-centre.yml"
  push:
    branches: [feature/ai-resources-centre]
    paths:
      - "ai-resources-centre/**"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-resources-centre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
